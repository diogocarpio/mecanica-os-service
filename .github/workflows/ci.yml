name: os-service-ci-cd

on:
  push:
    branches: [main, develop, homologacao, feature/diogo]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run tests and coverage
        run: mvn -B verify
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_QG_WAIT: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: >-
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning::SONAR_TOKEN não configurado. Análise SonarCloud ignorada.";
            exit 0;
          fi;
          mvn -B sonar:sonar
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.qualitygate.wait=${{ env.SONAR_QG_WAIT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/classes

  sonar-fortify:
    name: Fortify Analysis
    runs-on: ubuntu-24.04
    needs: build-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check Fortify configuration
        id: fortify-config
        env:
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
        run: |
          if [ -n "${FOD_URL}" ] && [ -n "${FOD_CLIENT_ID}" ] && [ -n "${FOD_CLIENT_SECRET}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Credenciais Fortify não configuradas. Scan Fortify será ignorado."
          fi
      - name: Fortify Scan
        if: steps.fortify-config.outputs.enabled == 'true'
        uses: fortify/github-action@v3
        env:
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}

  docker-build:
    name: Build Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, sonar-fortify]
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"
      - name: Load runtime secrets from AWS Secrets Manager
        env:
          RUNTIME_SECRET_ID: ${{ vars.RUNTIME_SECRET_ID }}
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > runtime-secrets.json
          for key in DATABASE_USERNAME DATABASE_PASSWORD RABBITMQ_HOST RABBITMQ_PORT RABBITMQ_USERNAME RABBITMQ_PASSWORD; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' runtime-secrets.json)"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Apply secrets and manifests
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}
          NAMESPACE: os-service
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NAMESPACE" app.kubernetes.io/part-of=mecanica --overwrite
          kubectl -n "$NAMESPACE" create secret generic os-service-secret \
            --from-literal=DATABASE_USERNAME="$DATABASE_USERNAME" \
            --from-literal=DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            --from-literal=RABBITMQ_HOST="$RABBITMQ_HOST" \
            --from-literal=RABBITMQ_PORT="$RABBITMQ_PORT" \
            --from-literal=RABBITMQ_USERNAME="$RABBITMQ_USERNAME" \
            --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          sed "s#image: os-service:latest#image: $IMAGE#g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status deployment/os-service --timeout=180s
      - name: Remove runtime secret file
        if: always()
        run: rm -f runtime-secrets.json

  deploy-production:
    name: Promote production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, deploy-staging]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"
      - name: Load runtime secrets from AWS Secrets Manager
        env:
          RUNTIME_SECRET_ID: ${{ vars.RUNTIME_SECRET_ID }}
        run: |
          aws secretsmanager get-secret-value \
            --secret-id "$RUNTIME_SECRET_ID" \
            --query SecretString \
            --output text > runtime-secrets.json
          for key in DATABASE_USERNAME DATABASE_PASSWORD RABBITMQ_HOST RABBITMQ_PORT RABBITMQ_USERNAME RABBITMQ_PASSWORD; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' runtime-secrets.json)"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Apply secrets and manifests
        env:
          IMAGE: ${{ needs.docker-build.outputs.image }}
          NAMESPACE: os-service
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NAMESPACE" app.kubernetes.io/part-of=mecanica --overwrite
          kubectl -n "$NAMESPACE" create secret generic os-service-secret \
            --from-literal=DATABASE_USERNAME="$DATABASE_USERNAME" \
            --from-literal=DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            --from-literal=RABBITMQ_HOST="$RABBITMQ_HOST" \
            --from-literal=RABBITMQ_PORT="$RABBITMQ_PORT" \
            --from-literal=RABBITMQ_USERNAME="$RABBITMQ_USERNAME" \
            --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          sed "s#image: os-service:latest#image: $IMAGE#g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status deployment/os-service --timeout=180s
      - name: Remove runtime secret file
        if: always()
        run: rm -f runtime-secrets.json
