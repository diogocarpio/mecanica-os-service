# Contrato do Secret de runtime — OS Service

Este arquivo documenta as chaves obrigatórias do Secret `os-service-secret`
(namespace `os-service`). Ele **não deve ser aplicado** via `kubectl apply`:
o pipeline de CI/CD cria/atualiza o Secret imperativamente a partir do AWS
Secrets Manager (`RUNTIME_SECRET_ID`), no job `deploy-staging`/`deploy-production`.

## Origem dos valores

O workflow lê o JSON do secret `mecanica-os/<ambiente>/runtime` no AWS Secrets
Manager e injeta cada chave como variável de ambiente do job:

| Chave do JSON (Secrets Manager) | Chave no Secret k8s | Uso na aplicação |
|---|---|---|
| `DATABASE_USERNAME` | `DATABASE_USERNAME` | `spring.datasource.username` |
| `DATABASE_PASSWORD` | `DATABASE_PASSWORD` | `spring.datasource.password` |
| `RABBITMQ_HOST` | `RABBITMQ_HOST` | `spring.rabbitmq.host` |
| `RABBITMQ_PORT` | `RABBITMQ_PORT` | `spring.rabbitmq.port` |
| `RABBITMQ_USERNAME` | `RABBITMQ_USERNAME` | `spring.rabbitmq.username` |
| `RABBITMQ_PASSWORD` | `RABBITMQ_PASSWORD` | `spring.rabbitmq.password` |

## Observações

- `DATABASE_URL` permanece no ConfigMap `os-service-config`, pois o PostgreSQL
  é provisionado dentro do próprio cluster (`terraform/postgres`).
- Não versione valores reais neste arquivo nem no repositório.
- O JSON do Secrets Manager deve conter todas as chaves acima; o workflow falha
  se alguma estiver vazia.
